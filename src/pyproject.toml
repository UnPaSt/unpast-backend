[project]
name = "unpast-backend"
version = "0.1.0"
description = "Django/Celery backend for UnPaSt"
requires-python = ">=3.11,<3.12"
dependencies = [
    "django==4.2.28",
    "psycopg2-binary",
    "djangorestframework>=3.15.2",
    "djangorestframework-camel-case==1.1.2",
    "entrypoints==0.3",
    "requests>=2.32.4",
    "gunicorn>=22.0.0",
    "django-cors-headers==3.11.0",
    "celery==5.3.0",
    "django-redis==5.2.0",
    "kneed==0.8.5",
    "cryptography>=46.0.5",
    "unpast",
    "sqlparse (>=0.6.0,<0.7.0)",
    "pillow (>=13.0.0,<14.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
unpast = { path = "app", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
